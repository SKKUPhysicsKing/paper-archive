name: Release Windows app

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/release-windows.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create version tag
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$packageVersion"
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
          if (-not $remoteTag) {
            git tag $tag $env:GITHUB_SHA
            git push origin "refs/tags/$tag"
          }

      - name: Test and build Windows installer
        run: npm run release:win

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$packageVersion"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title $packageVersion --generate-notes
          }

          $assets = Get-ChildItem release -File | Where-Object {
            $_.Name -eq "latest.yml" -or
            $_.Name -like "Paper-Archive-Setup-*.exe" -or
            $_.Name -like "Paper-Archive-Setup-*.exe.blockmap"
          }

          if ($assets.Count -ne 3) {
            throw "Expected installer, latest.yml, and blockmap; found $($assets.Count) release assets."
          }

          gh release upload $tag @($assets.FullName) --clobber
