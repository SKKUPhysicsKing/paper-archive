name: Release Windows app

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/release-windows.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create version tag
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$packageVersion"
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
          if (-not $remoteTag) {
            git tag $tag $env:GITHUB_SHA
            git push origin "refs/tags/$tag"
          }

      - name: Test and build Windows installer
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npm run release:win

      - name: Create checksums and software bill of materials
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -File -Filter "Paper-Archive-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not created."
          }

          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content release/SHA256SUMS.txt -Encoding ascii
          npm sbom --omit=dev --sbom-format cyclonedx | Out-File release/sbom.cdx.json -Encoding utf8

      - name: Attest installer provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/Paper-Archive-Setup-*.exe

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$packageVersion"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title $packageVersion --generate-notes
          }

          $assets = Get-ChildItem release -File | Where-Object {
            $_.Name -eq "latest.yml" -or
            $_.Name -eq "SHA256SUMS.txt" -or
            $_.Name -eq "sbom.cdx.json" -or
            $_.Name -like "Paper-Archive-Setup-*.exe" -or
            $_.Name -like "Paper-Archive-Setup-*.exe.blockmap"
          }

          if ($assets.Count -ne 5) {
            throw "Expected installer, update metadata, checksum, and SBOM; found $($assets.Count) release assets."
          }

          gh release upload $tag @($assets.FullName) --clobber
